<style>
/* Startseite: zwei große Bildkacheln (Tagesabschluss, Röstplan) im Farbschema Crema, ganz in Helvetica Neue */
:root{
  --bg:#F3EEE7; --paper:#FBF8F3; --ink:#2B211B; --muted:#7A6A5D; --line:#E3D9CC;
  --accent:#8A5A3B; --shadow:rgba(60,40,25,.13);
  --c1a:#EBD6BC; --c1b:#D7AE84; --c2a:#6A4630; --c2b:#2F1F16; --c3a:#E3E8D9; --c3b:#BCC8AC;
  --f:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17120F; --paper:#211A16; --ink:#EFE7DF; --muted:#AD9E91; --line:#3A2F28;
  --accent:#D3A27C; --shadow:rgba(0,0,0,.5);
  --c1a:#5A412E; --c1b:#3B2A1E; --c2a:#3E2A1D; --c2b:#1B120D; --c3a:#39402F; --c3b:#1F241A;
  color-scheme:dark}
  .sheen{opacity:.35}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:16px/1.45 var(--f);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.date{margin:0;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
h1{margin:4px 0 22px;font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.025em}
.tiles{display:grid;gap:16px}
@media (min-width:900px){.wrap{max-width:1040px}.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:26px;overflow:hidden;
  box-shadow:0 1px 1px rgba(0,0,0,.03),0 12px 30px var(--shadow);-webkit-tap-highlight-color:transparent;
  transition:transform .18s cubic-bezier(.3,.7,.4,1),box-shadow .18s}
.tile:active{transform:scale(.975);box-shadow:0 1px 1px rgba(0,0,0,.03),0 6px 16px var(--shadow)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.art{display:block;width:100%;height:auto;aspect-ratio:340/170}
.meta{display:flex;align-items:center;gap:12px;padding:15px 16px 17px 20px}
.meta div{flex:1;min-width:0}
.meta h2{margin:0;font-size:22px;line-height:1.15;font-weight:700;letter-spacing:-.015em}
.meta p{margin:3px 0 0;color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p b{color:var(--accent);font-weight:600}
.go{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--accent)}
.go svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.foot{margin:22px 4px 0;color:var(--muted);font-size:13px;text-align:center}
@media (prefers-reduced-motion:no-preference){
  .tile{animation:rise .55s cubic-bezier(.2,.8,.25,1) both}
  .tile:nth-child(2){animation-delay:.09s}.tile:nth-child(3){animation-delay:.18s}
  .pour{animation:pour 1.1s linear infinite}@keyframes pour{to{stroke-dashoffset:-28}}
  .drip{animation:drip 2.4s ease-in infinite}@keyframes drip{0%{opacity:0;transform:translateY(-6px)}20%{opacity:1}80%{opacity:1;transform:translateY(16px)}100%{opacity:0;transform:translateY(18px)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .drop{animation:drop .7s cubic-bezier(.3,1.5,.5,1) .35s both}
  @keyframes drop{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
  .steam path{animation:steam 4.2s ease-in-out infinite}
  .steam path:nth-child(2){animation-delay:1.4s}.steam path:nth-child(3){animation-delay:2.8s}
  @keyframes steam{0%{opacity:0;transform:translateY(8px)}35%{opacity:.75}100%{opacity:0;transform:translateY(-14px)}}
  .tumble{animation:tumble 9s linear infinite;transform-origin:150px 104px;transform-box:view-box}
  @keyframes tumble{to{transform:rotate(360deg)}}
}
</style>

<script>
(function(){
  const now = new Date(), h = now.getHours();
  document.getElementById("date").textContent = now.toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long"});
  document.getElementById("hello").textContent = h < 11 ? "Guten Morgen" : h < 17 ? "Guten Tag" : "Guten Abend";
  const get = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

  // Tagesabschluss: letzter gespeicherter Abschluss
  const hist = get("kasse.history");
  if (Array.isArray(hist) && hist.length) {
    const last = hist.map(x => String(x.date || "")).filter(Boolean).sort().pop();
    if (last) {
      const y = new Date(now); y.setDate(y.getDate() - 1);
      const d = new Date(last + "T12:00:00");
      const txt = last === iso(now) ? "<b>Heute abgeschlossen</b>"
        : last === iso(y) ? "Letzter Abschluss: gestern"
        : isNaN(d) ? "" : "Letzter Abschluss: " + esc(d.toLocaleDateString("de-DE", {weekday:"short", day:"numeric", month:"short"}));
      if (txt) document.getElementById("s1").innerHTML = txt;
    }
  }

  // Röstplan: Woche, Sorten, Menge
  const rp = get("roestplan.v4");
  if (rp && Array.isArray(rp.sorts) && rp.sorts.length && rp.source !== "preset") {
    const kg = rp.sorts.reduce((a, s) => a + (s.totalG | 0), 0) / 1000;
    document.getElementById("s2").innerHTML = (rp.week ? "<b>" + esc(rp.week) + "</b> · " : "") + rp.sorts.length + " Sorten · " + kg.toLocaleString("de-DE", {maximumFractionDigits: 0}) + " kg";
  }
  // Brühbuch: letzter Brühvorgang oder Anzahl Rezepte
  const bb = get("bruehbuch-v1");
  if (bb && bb.setup) {
    const l = Array.isArray(bb.log) && bb.log[0], rz = Array.isArray(bb.rz) ? bb.rz.length : 0;
    let t = "";
    if (l && l.at) {
      const d = new Date(l.at), days = Math.round((new Date(iso(now) + "T12:00:00") - new Date(iso(d) + "T12:00:00")) / 864e5);
      const when = days === 0 ? "heute" : days === 1 ? "gestern" : d.toLocaleDateString("de-DE", {day:"numeric", month:"short"});
      t = "Zuletzt <b>" + esc(l.name || "gebrüht") + "</b> · " + when;
    } else if (rz) t = rz + (rz === 1 ? " Rezept" : " Rezepte");
    if (t) document.getElementById("s3").innerHTML = t;
  }
})();
</script>
