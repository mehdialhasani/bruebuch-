<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brühbuch</title>
<meta name="description" content="Rezepte, Gießplan und Ausrüstung für Filterkaffee, AeroPress und French Press">
<meta name="theme-color" content="#f2ede6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brühbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:light;
 --bg:#f2ede6;--card:#fffdfa;--ink:#1d1d1f;--ink2:#5d544c;--mut:#968b80;--hair:rgba(90,60,30,.13);
 --acc:#8a5a3b;--acc2:#c99a6b;--fill:rgba(138,90,59,.09);--fill2:rgba(120,90,60,.15);--warn:#c0503a;--ok:#2f8a55;--bar:#f7f3ee;
 --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
 --num:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
 /* Aufguss-Farben (Okabe-Ito-nah) + Form je Aufguss */
 --c0:#3f6fa8;--c1:#d9822b;--c2:#7d5fae;--c3:#2f9773;--c4:#c4533a;--c5:#3e9fc8;
 --pp-bg1:#fffdf9;--pp-bg2:#ecdfcf;--pp-halo:#ffffff;--pp-ink:#1d1d1f;--pp-ink2:#7a6b5e;--pp-acc:#9a6236;--pp-acc2:#e0aa6c;
 --pp-track:rgba(120,90,60,.13);--pp-seg:rgba(154,98,54,.30);--pp-glass:rgba(255,255,255,.42);--pp-glass-edge:rgba(105,80,58,.42);
 --pp-paper:#fbf6ee;--pp-steam:rgba(130,110,90,.45);--pp-scale:#ddd3c7;--pp-chip:rgba(255,255,255,.72);--pp-rim:rgba(255,255,255,.0)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
 --bg:#151210;--card:#211c18;--ink:#f4efe9;--ink2:#c9bdb1;--mut:#8f8378;--hair:rgba(255,235,210,.12);
 --acc:#d69c66;--acc2:#8a6040;--fill:rgba(214,156,102,.12);--fill2:rgba(214,156,102,.2);--warn:#e8775f;--ok:#5cc487;--bar:#1b1714;
 --c0:#6f9be0;--c1:#f0a04a;--c2:#a88ad8;--c3:#4fc095;--c4:#e8775f;--c5:#6cc3e6;
 --pp-bg1:#33291f;--pp-bg2:#0d0b09;--pp-halo:#5a4330;--pp-ink:#f5f2ee;--pp-ink2:#b9ab9d;--pp-acc:#d39a5e;--pp-acc2:#f3c993;
 --pp-track:rgba(255,255,255,.09);--pp-seg:rgba(211,154,94,.36);--pp-glass:rgba(255,255,255,.06);--pp-glass-edge:rgba(255,255,255,.34);
 --pp-paper:#3b3129;--pp-steam:rgba(255,255,255,.32);--pp-scale:#2d2622;--pp-chip:rgba(30,25,22,.78);--pp-rim:rgba(255,255,255,.22)}}
:root[data-theme=dark]{color-scheme:dark;
 --bg:#151210;--card:#211c18;--ink:#f4efe9;--ink2:#c9bdb1;--mut:#8f8378;--hair:rgba(255,235,210,.12);
 --acc:#d69c66;--acc2:#8a6040;--fill:rgba(214,156,102,.12);--fill2:rgba(214,156,102,.2);--warn:#e8775f;--ok:#5cc487;--bar:#1b1714;
 --c0:#6f9be0;--c1:#f0a04a;--c2:#a88ad8;--c3:#4fc095;--c4:#e8775f;--c5:#6cc3e6;
 --pp-bg1:#33291f;--pp-bg2:#0d0b09;--pp-halo:#5a4330;--pp-ink:#f5f2ee;--pp-ink2:#b9ab9d;--pp-acc:#d39a5e;--pp-acc2:#f3c993;
 --pp-track:rgba(255,255,255,.09);--pp-seg:rgba(211,154,94,.36);--pp-glass:rgba(255,255,255,.06);--pp-glass-edge:rgba(255,255,255,.34);
 --pp-paper:#3b3129;--pp-steam:rgba(255,255,255,.32);--pp-scale:#2d2622;--pp-chip:rgba(30,25,22,.78);--pp-rim:rgba(255,255,255,.22)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
.pg{max-width:460px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(86px + env(safe-area-inset-bottom))}
h1{font-size:28px;letter-spacing:-.03em;margin:6px 2px 12px}
h2.sh{font-size:13px;font-weight:600;color:var(--mut);text-transform:none;margin:18px 4px 6px}
.mut{color:var(--mut)}
.pk{width:100%;height:100%;display:block}
/* Tab-Leiste: fester Hintergrund, kein Filter */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--bar);border-top:1px solid var(--hair);padding:6px 8px max(8px,env(safe-area-inset-bottom))}
.tabs button{flex:1;max-width:150px;border:0;background:none;display:grid;justify-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:600;color:var(--mut)}
.tabs svg{width:26px;height:26px}
.tabs button.on{color:var(--acc)}
/* Heute-Leiste (womit brühe ich) */
.today{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:2px 16px}
.today::-webkit-scrollbar{display:none}
.tdy{flex:none;display:flex;align-items:center;gap:7px;height:44px;padding:0 12px 0 5px;border:1px solid var(--hair);border-radius:14px;background:var(--card);font-size:13px;font-weight:650;max-width:200px}
.tdy .ic{width:34px;height:34px;flex:none}
.tdy span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdy small{display:block;font-size:10.5px;font-weight:500;color:var(--mut);line-height:1}
/* Rezept-Kopf */
.rh{display:flex;align-items:center;gap:10px;margin:2px 2px 10px}
.rh .t{flex:1;min-width:0}
.rh .t b{display:block;font-size:20px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh .t span{font-size:12.5px;color:var(--mut)}
.pill{height:34px;padding:0 13px;border:0;border-radius:99px;background:var(--fill2);font-size:13px;font-weight:650;color:var(--ink);white-space:nowrap}
.pill.acc{background:var(--acc);color:#fff}
/* Kennzahlen */
.kz{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.kz div{background:var(--card);border-radius:14px;padding:8px 8px 7px;min-width:0}
.kz b{display:block;font:700 16px var(--num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kz span{font-size:11px;color:var(--mut)}
/* Diagramm */
.chart{background:var(--card);border-radius:18px;margin-bottom:10px;position:relative}
.chart svg{display:block;width:100%;height:auto}
.t{fill:var(--mut);font:10px var(--f)}
.tb{fill:var(--ink);font:700 11px var(--num)}
.gr{stroke:var(--hair);stroke-width:1}
.lay{opacity:.12;cursor:pointer}.lay.on{opacity:.26}
.hit{fill:transparent;touch-action:none;cursor:grab}
.bub rect{fill:var(--pc)}.bub text{fill:#fff;font:700 12px var(--num)}
.gh{fill:none;stroke:var(--mut);stroke-width:1.4;stroke-dasharray:4 4;opacity:.7}
.ln{fill:none;stroke:var(--acc);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chint{position:absolute;left:44px;top:4px;font-size:11px;color:var(--mut)}
/* Marke: Form + Nummer */
.mk{display:inline-grid;place-items:center;width:26px;height:26px;flex:none;position:relative}
.mk svg{position:absolute;inset:0;width:100%;height:100%}
.mk i{position:relative;font:700 12px var(--num);font-style:normal;color:#fff}
.mk.ic0{color:var(--mut);font-weight:700}
/* Lineal */
.ru{display:flex;gap:6px;align-items:center;min-width:0}
.pm{flex:none;width:42px;height:42px;border:0;border-radius:12px;background:var(--fill2);font:600 22px var(--num);user-select:none;-webkit-user-select:none}
.pm:active{background:var(--pc,var(--acc));color:#fff}.pm:disabled{opacity:.3}
.rl{flex:1;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.rl::-webkit-scrollbar{display:none}
.rv{flex:none;min-width:48px;height:42px;padding:0 10px;border:1px solid var(--hair);border-radius:11px;background:var(--card);font:650 14px var(--num);white-space:nowrap}
.rv.on{background:var(--pc,var(--acc));border-color:var(--pc,var(--acc));color:#fff}
.seg{display:flex;padding:3px;border-radius:11px;background:var(--fill)}
.seg button{flex:1;min-width:0;height:34px;border:0;border-radius:9px;background:none;font-size:13px;font-weight:650;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg button b{font-family:var(--num)}
.tch{display:flex;gap:5px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border:1px solid var(--hair);border-radius:99px;background:var(--card);font-size:12.5px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--pc,var(--acc));border-color:var(--pc,var(--acc));color:#fff}
.acts{display:flex;gap:4px;justify-content:flex-end}
.lnk{height:32px;padding:0 8px;border:0;background:none;font-size:13.5px;font-weight:650;color:var(--acc)}
.lnk.del{color:var(--warn)}
.note{font-size:12.5px;color:var(--mut);line-height:1.35}
/* A Ausklappen */
.ac{background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:10px}
.ar{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border:0;background:none;text-align:left;border-bottom:1px solid var(--hair)}
.ac>div:last-child>.ar,.ac>div:last-child>.ab{border-bottom:0}
.ar .nm{flex:1;min-width:0}.ar .nm b{display:block;font-size:15px}.ar .nm span{display:block;font-size:12.5px;color:var(--mut);margin-top:1px}
.ar .big{font:700 19px var(--num);white-space:nowrap}
.ar .chev{width:18px;height:18px;color:var(--mut);transition:transform .2s;flex:none}
.ao .ar{background:color-mix(in srgb,var(--pc) 9%,var(--card))}
.ao .ar .chev{transform:rotate(180deg)}
.ab{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:8px 14px 12px;background:color-mix(in srgb,var(--pc) 9%,var(--card));border-bottom:1px solid var(--hair)}
.ar .ic{width:30px;height:30px;flex:none}
/* Fuß */
.foot{display:flex;align-items:center;gap:8px;margin:2px 2px 12px;flex-wrap:wrap}
.foot .sp{flex:1}
.go{display:block;width:100%;height:54px;border:0;border-radius:16px;background:var(--acc);color:#fff;font-size:17px;font-weight:700;margin:6px 0 8px}
.go:active{transform:scale(.99)}
.sec{display:flex;gap:8px}
.sec button{flex:1}
/* Anfänger:in */
.cups{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.cupb{border:1px solid var(--hair);border-radius:16px;background:var(--card);padding:10px 0 8px;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--ink2)}
.cupb svg{width:34px;height:34px}
.cupb b{font:700 16px var(--num);color:var(--ink)}
.cupb.on{border-color:var(--acc);box-shadow:0 0 0 1.5px var(--acc)}
.easy{background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:10px;display:grid;gap:4px}
.easy .r{display:flex;gap:10px;align-items:baseline}
.easy .r span{color:var(--mut);min-width:96px;font-size:13px}
.easy .r b{font-size:15px}
/* Listen (Profil, Rezepte) */
.ls{background:var(--card);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 14px;border:0;border-bottom:1px solid var(--hair);background:none;text-align:left}
.ls>.li:last-child,.ls>:last-child .li{border-bottom:0}
.li .ic{width:36px;height:36px;flex:none}
.li .nm{flex:1;min-width:0}
.li .nm b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .nm span{display:block;font-size:12.5px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .val{font-size:14px;color:var(--mut);white-space:nowrap}
.li .star{width:22px;height:22px;flex:none;color:var(--acc)}
.li.add{color:var(--acc);font-weight:650;justify-content:flex-start;min-height:46px}
.li.add .ic{display:grid;place-items:center;font-size:22px;width:36px}
.li .go2{width:16px;height:16px;color:var(--mut);flex:none}
/* Profil-Kopf */
.me{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.av{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 24px var(--num);color:#fff;background:linear-gradient(140deg,#c98b57,#7a4a2c)}
.me input{border:0;background:none;font-size:20px;font-weight:700;width:100%;padding:2px 0;border-bottom:1px solid transparent}
.me input:focus{outline:0;border-bottom-color:var(--hair)}
.me .nm{flex:1;min-width:0}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.lvb{border:1px solid var(--hair);border-radius:16px;background:var(--card);padding:10px 6px 9px;display:grid;justify-items:center;gap:4px;font-size:12.5px;font-weight:650}
.lvb svg{width:40px;height:40px}
.lvb.on{border-color:var(--acc);box-shadow:0 0 0 1.5px var(--acc)}
/* Blatt (Sheet) */
.shw{position:fixed;inset:0;z-index:55;background:rgba(20,14,10,.38);display:flex;align-items:flex-end;justify-content:center}
.sht{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px max(18px,env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sht{animation:none}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--hair);margin:2px auto 8px}
.shh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.shh b{flex:1;font-size:18px}
.x{width:34px;height:34px;border:0;border-radius:50%;background:var(--fill2);font-size:18px;line-height:1}
.fl{display:grid;gap:6px;margin-bottom:12px}
.fl>label,.fl>.lab{font-size:12.5px;color:var(--mut);margin-left:2px}
.tx{width:100%;height:44px;border:1px solid var(--hair);border-radius:12px;background:var(--card);padding:0 12px;font-size:15px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--hair);border-radius:16px;background:var(--card);padding:8px 4px 8px;display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:600;text-align:center;line-height:1.15;min-height:92px}
.tile .ic{width:44px;height:44px}
.tile.on{border-color:var(--acc);box-shadow:0 0 0 1.5px var(--acc)}
.tile small{font-weight:500;color:var(--mut);font-size:10.5px}
/* Einrichtung */
.ob{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto}
.ob .pg{padding-bottom:max(24px,env(safe-area-inset-bottom))}
.obs{display:flex;gap:5px;justify-content:center;margin:8px 0 14px}
.obs i{width:26px;height:5px;border-radius:3px;background:var(--hair)}.obs i.on{background:var(--acc)}
.ob h1{text-align:center;margin-bottom:4px}
.ob p.lead{text-align:center;color:var(--mut);margin:0 0 16px}
/* Brühen-Vollbild */
.bw{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto}
.bw .pg{display:flex;flex-direction:column;align-items:center;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.bwh{display:flex;width:100%;align-items:center;gap:8px}
.bwh b{flex:1;font-size:15px;text-align:center}
#stage{width:min(100%,320px);aspect-ratio:1}
.pp{width:100%;height:100%;display:block;overflow:visible}
.pp-g{font-family:var(--num);font-size:17px;font-weight:700;fill:var(--pp-ink);font-variant-numeric:tabular-nums}
.pp-gc{font-family:var(--f);font-size:10.5px;font-weight:600;fill:var(--pp-ink2)}
.time{font:600 50px/1 var(--num);letter-spacing:-.02em;margin-top:4px}
.btitle{margin-top:8px;font-size:23px;font-weight:700;letter-spacing:-.02em;text-align:center}
.bline{margin-top:4px;font-size:15px;color:var(--ink2);text-align:center;min-height:20px}
.bnext{margin-top:3px;font-size:13px;color:var(--mut);text-align:center;min-height:18px}
.bbig{display:flex;gap:8px;align-items:baseline;margin-top:8px}
.bbig b{font:700 26px var(--num)}.bbig span{color:var(--mut)}
.strip{width:100%;display:block;margin-top:10px}
.bctl{display:flex;gap:8px;width:100%;margin-top:12px}
.bctl .go{margin:0;flex:2}.bctl .pill{flex:1;height:54px;border-radius:16px}
.ring2{width:min(100%,300px);aspect-ratio:1}
/* Bewerten */
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kp button{height:58px;border:1px solid var(--hair);border-radius:14px;background:var(--card);font-size:12.5px;font-weight:650;line-height:1.15;color:var(--ink2)}
.kp button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stars{display:flex;gap:4px;justify-content:center}
.stars button{width:46px;height:46px;border:0;background:none;font-size:30px;color:var(--hair);line-height:1}
.stars button.on{color:#e0a43a}
.tip{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;margin:10px 0}
.tip b{display:block}
.tip .nm{flex:1}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:600;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.empty{padding:18px;text-align:center;color:var(--mut);background:var(--card);border-radius:16px}
.hist .li .val{font-family:var(--num);font-weight:700;color:var(--ink)}
@media (min-width:700px){.pg{padding-top:24px}}

</style></head>
<body>
<section id="pg-br"><div class="pg" id="brx"><div id="brTop"></div><div class="chart" id="chart"></div><div id="brRows"></div><div id="brFoot"></div></div></section>
<section id="pg-rz" hidden><div class="pg" id="rzx"></div></section>
<section id="pg-pr" hidden><div class="pg" id="prx"></div></section>

 <button data-a="tab" data-t="rz" role="tab"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="16" height="20" rx="3"/><path d="M10 10h8M10 14h8M10 18h5"/></svg>Rezepte</button>
 <button data-a="tab" data-t="pr" role="tab"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="10" r="4.5"/><path d="M5.5 24c1-4.5 4.5-7 8.5-7s7.5 2.5 8.5 7"/></svg>Profil</button>
</nav>
<div class="bw" id="bw" hidden><div class="pg">
 <div class="bwh"><button class="x" id="bwX" aria-label="Schließen">×</button><b id="bwName"></b><span style="width:34px"></span></div>
 <div id="stage"></div>

function drawOb(){var o=$('ob'),h='<div class="pg"><div class="obs">'+[0,1,2].map(function(i){return '<i class="'+(i<=OB.step?'on':'')+'"></i>'}).join('')+'</div>';
 if(OB.step==0){h+='<h1>Willkommen</h1><p class="lead">Wie gut kennst du dich aus? Du kannst das jederzeit im Profil ändern.</p><div class="ls">'+['a','m','p'].map(function(l){return '<button class="li" data-a="obl" data-v="'+l+'" style="min-height:72px"><span class="ic" style="width:48px;height:48px">'+PK['l'+(' amp'.indexOf(l))]+'</span><span class="nm"><b>'+LVN[l]+'</b><span style="white-space:normal">'+LVT[l]+'</span></span>'+(OB.lv==l?'<span class="val">✓</span>':'')+'</button>'}).join('')+'</div>'}
 if(OB.step==1){h+='<h1>Womit brühst du?</h1><p class="lead">Wähle alles, was du hast. Mehrere gehen.</p><div class="grid3">'+DEVO.map(function(t){return '<button class="tile'+(OB.dev.indexOf(t)>=0?' on':'')+'" data-a="obd" data-v="'+t+'"><span class="ic">'+devIc(t)+'</span>'+DEVC[t].n+(DEVC[t].sub?'<small>'+DEVC[t].sub+'</small>':'')+'</button>'}).join('')+'</div>'}
 if(OB.step==2){h+='<h1>Mühle, Waage, Kocher</h1><p class="lead">Daraus rechnet die App Mahlgrad, Gramm oder Messlöffel und Temperatur.</p><h2 class="sh">Mühle</h2><div class="grid3">'+GRO.map(function(t){return '<button class="tile'+(OB.gr.indexOf(t)>=0?' on':'')+'" data-a="obg" data-v="'+t+'"><span class="ic">'+PK[GRC[t].k]+'</span>'+GRC[t].n+'</button>'}).join('')+'</div>'+
  '<h2 class="sh">Waage</h2><div class="grid3" style="grid-template-columns:1fr 1fr"><button class="tile'+(OB.sc?' on':'')+'" data-a="obs" data-v="1"><span class="ic">'+PK.scale+'</span>Ich habe eine Waage</button><button class="tile'+(!OB.sc?' on':'')+'" data-a="obs" data-v="0"><span class="ic">'+PK.noscale+'</span>Ohne Waage<small>Messlöffel und ml</small></button></div>'+
  '<h2 class="sh">Wasserkocher</h2><div class="grid3" style="grid-template-columns:1fr 1fr"><button class="tile'+(OB.ke?' on':'')+'" data-a="obk" data-v="1"><span class="ic">'+PK.kettle+'</span>Mit Temperatur</button><button class="tile'+(!OB.ke?' on':'')+'" data-a="obk" data-v="0"><span class="ic">'+PK.pot+'</span>Ohne Temperatur</button></div>'}
 h+='<div class="sec" style="margin-top:18px">'+(OB.step?'<button class="pill" data-a="obback" style="height:50px">Zurück</button>':'<button class="pill" data-a="obskip" style="height:50px">Später</button>')+'<button class="pill acc" data-a="obnext" style="height:50px"'+(OB.step==1&&!OB.dev.length?' disabled':'')+'>'+(OB.step==2?'Fertig':'Weiter')+'</button></div><p class="note" style="text-align:center;margin-top:12px">Genaue Modelle, Filter und mehr trägst du danach im Profil ein.</p></div>';
 o.innerHTML=h;o.hidden=false}
function obDone(skip){if(!skip){DB.eq=DB.eq.filter(function(e){return ['geraet','muehle','waage','kocher'].indexOf(e.kat)<0});OB.dev.forEach(function(t,i){var d=mkDev(t);if(!i)d.fav=true;DB.eq.push(d)});OB.gr.forEach(function(t,i){var g=mkGr(t);if(!i)g.fav=true;DB.eq.push(g)});if(OB.sc)DB.eq.push(mkSc(0));DB.eq.push(mkKe(OB.ke?0:3));
  if(!eqOf('filter').length&&OB.dev.some(function(t){return DEVC[t].m=='filter'})){var f=mkFi();f.passt=OB.dev.filter(function(t){return DEVC[t].m=='filter'&&t!='chemex'});DB.eq.push(f)}PR.stufe=OB.lv}
 seedDefaults();DB.heute={};W=null;$('ob').hidden=true;$('ob').innerHTML='';render()}

/* ---------- Rahmen ---------- */
function render(){theme();['br','rz','pr'].forEach(function(t){$('pg-'+t).hidden=U.tab!=t});[].forEach.call(document.querySelectorAll('.tabs button'),function(b){b.classList.toggle('on',b.dataset.t==U.tab);b.setAttribute('aria-selected',b.dataset.t==U.tab)});
 if(U.tab=='br'){if(!W)loadW();drawBr()}else if(U.tab=='rz')drawRz();else drawPr()}
var tt=0;function toast(s){var t=$('toast');t.textContent=s;t.hidden=false;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){t.style.opacity=0;setTimeout(function(){t.hidden=true},300)},1800)}
function useRz(id){var r=rzById(id);if(!r)return;var d=dev();if(d.typ!=r.typ){var e=eqOf('geraet').filter(function(x){return x.typ==r.typ})[0];if(e)DB.heute.geraet=e.id}DB.heute.rz=DB.heute.rz||{};DB.heute.rz[r.typ]=r.id;if(DB.draft&&DB.draft.id!=r.id)DB.draft=null;save();W=null;U.open=1;U.tab='br';closeSh();render()}

/* ---------- Bedienung ---------- */
document.addEventListener('click',function(ev){var x=ev.target.closest('[data-a]');if(!x||x.disabled)return;var d=x.dataset,a=d.a,e=U.sh&&U.sh.id&&byId(U.sh.id);
 if(x.tagName=='INPUT')return;
 switch(a){
 case 'tab':U.tab=d.t;try{localStorage.setItem('bruehbuch-tab',U.tab)}catch(z){}closeSh();render();window.scrollTo(0,0);return;
 case 'open':var o=/^\d+$/.test(d.o)?+d.o:d.o;U.open=U.open===o?-1:o;U.k=typeof o=='number'?'g':o=='water'?'water':o;drawBr();return;
 case 'k':U.k=d.k;drawBr();return;
 case 'val':var r=x.closest('.ru');setV(r.dataset.rk,+r.dataset.ri,+d.v);touch();drawBr(1);return;
 case 'tech':W.P[+d.i].n=d.t;touch();drawBr(1);return;
 case 'add':addAfter(+d.i);return;
 case 'del':delStep(+d.i);return;
 case 'cups':W.cups=+d.n;applyCups();touch();drawBr();return;
 case 'str':W.str=d.s;applyCups();touch();drawBr();return;
 case 'brew':openBrew();return;
 case 'discard':DB.draft=null;W=cp(rzById(W.id));save();drawBr();return;
 case 'saverz':saveRz();return;
 case 'pick':openSh({k:'pick',kat:d.k});return;
 case 'today':var kat=U.sh.kat;DB.heute[kat]=d.id;if(kat=='geraet'){DB.draft=null;W=null}save();closeSh();render();return;
 case 'shx':closeSh();return;
 case 'eqadd':openSh({k:'eqadd',kat:d.kat});return;
 case 'eqnew':var k2=U.sh.kat,n=k2=='geraet'?mkDev(d.typ):k2=='muehle'?mkGr(d.typ):k2=='waage'?mkSc(+d.typ):k2=='kocher'?mkKe(+d.typ):mkFi();
  if(k2=='filter'){n.typ=d.typ;n.name=FTC.filter(function(f){return f[0]==d.typ})[0][1];n.passt=typesOwned().filter(function(t){return DEVC[t].m=='filter'})}
  if(!eqOf(k2).length)n.fav=true;DB.eq.push(n);save();openSh({k:'eq',id:n.id});render();return;
 case 'eq':openSh({k:'eq',id:d.id});return;
 case 'set':if(U.sh&&U.sh.k=='pref'){var pf=d.f.replace(/^p\./,''),pv=d.v;PR[pf]=/^-?[\d.]+$/.test(pv)&&pf!='einheit'?+pv:pv;if(pf=='vib'||pf=='wach')PR[pf]=pv=='1';save();drawSh();render();return}
  if(!e)return;var f=d.f,v=d.v;
  if(f.indexOf('s.')==0)e.s[f.slice(2)]=+v;else if(f=='timer'||f=='temp'||f=='hals')e[f]=v=='1';else if(f=='genau'||f=='st')e[f]=+v;
  else if(f=='typ'&&e.kat=='geraet'){var old=DEVC[e.typ].n;e.typ=v;if(e.name==old)e.name=DEVC[v].n}
  else if(f=='typ'&&e.kat=='filter'){var o2=FTC.filter(function(z){return z[0]==e.typ})[0];e.typ=v;if(o2&&e.name==o2[1])e.name=FTC.filter(function(z){return z[0]==v})[0][1]}
  else e[f]=v;
  if(f=='st'){['filter','fp','aero'].forEach(function(m){e.s[m]=Math.round(e.s[m]/e.st)*e.st})}
  save();drawSh();render();return;
 case 'passt':if(!e)return;e.passt=e.passt||[];var ix=e.passt.indexOf(d.v);if(ix>=0)e.passt.splice(ix,1);else e.passt.push(d.v);save();drawSh();render();return;
 case 'fav':case 'favq':var it=a=='fav'?e:byId(d.id);if(!it)return;var was=it.fav;eqOf(it.kat).forEach(function(z){z.fav=false});it.fav=!was;if(it.fav)delete DB.heute[it.kat];save();if(a=='fav')drawSh();render();return;
 case 'eqdel':if(!e)return;if(e.kat=='geraet'&&eqOf('geraet').length<2){toast('Mindestens ein Brühgerät bleibt');return}if(!confirm('„'+e.name+'“ entfernen?'))return;DB.eq=DB.eq.filter(function(z){return z!==e});if(DB.heute[e.kat]==e.id)delete DB.heute[e.kat];save();closeSh();W=null;render();return;
 case 'pref':openSh({k:'pref',f:d.f,typ:d.typ,t:x.querySelector('b').textContent});return;
 case 'pset':PR[d.f]=d.v;save();if(U.sh)drawSh();W=null;render();return;
 case 'pstd':PR.std[U.sh.typ]=d.id;save();drawSh();render();return;
 case 'data':openSh({k:'data'});return;
 case 'export':exportJSON();return;
 case 'atlas':var nn=fromAtlas(atlasData()||[]);closeSh();render();toast(nn+' Rezepte übernommen');return;
 case 'reset':if(!confirm('Wirklich alles löschen? Vorher am besten eine Sicherung speichern.'))return;try{localStorage.removeItem(KEY)}catch(z){}DB=fresh();PR=DB.profil;W=null;closeSh();boot();return;
 case 'rzpick':openSh({k:'rzpick'});return;
 case 'rzuse':useRz(d.id);return;
 case 'rznew':openSh({k:'rznew',typ:d.typ});return;
 case 'rznewtyp':U.sh.typ=d.typ;drawSh();return;
 case 'rzmake':var t3=d.typ,nr=mkRz(t3,d.tpl=='dev'?null:TPL[d.tpl],DEVC[t3].n+' · '+(d.tpl=='dev'?'Neu':d.tpl));DB.rz.push(nr);save();useRz(nr.id);toast('Rezept angelegt');return;
 case 'rzact':openSh({k:'rzact',id:d.id});return;
 case 'rzbrew':useRz(U.sh.id);return;
 case 'rzstd':var rr=rzById(U.sh.id);PR.std[rr.typ]=rr.id;save();drawSh();render();return;
 case 'rzcopy':var rc=cp(rzById(U.sh.id));rc.id=uid();rc.name+=' · Kopie';rc.ver=1;rc.hist=[];delete rc.src;DB.rz.push(rc);save();closeSh();render();toast('Kopie angelegt');return;
 case 'rzback':var rb=rzById(U.sh.id),hv=rb.hist.pop();rb.hist.push({v:rb.ver,at:Date.now(),dose:rb.dose,end:rb.end,temp:rb.temp,P:rb.P,grind:rb.grind});['dose','end','temp','P','grind'].forEach(function(k){rb[k]=cp(hv[k])});rb.ver++;if(DB.draft&&DB.draft.id==rb.id)DB.draft=null;W=null;save();closeSh();render();toast('Version '+hv.v+' ist wieder aktiv');return;
 case 'rzdel':var rd=rzById(U.sh.id);if(!confirm('„'+rd.name+'“ löschen?'))return;DB.rz=DB.rz.filter(function(z){return z!==rd});if(PR.std[rd.typ]==rd.id)delete PR.std[rd.typ];if(DB.draft&&DB.draft.id==rd.id)DB.draft=null;W=null;save();closeSh();render();return;
 case 'rzf':U.rzf=d.v;drawRz();return;
 case 'rset':RT[d.f]=d.f=='stars'||d.f=='tds'?+d.v:d.v;drawSh();return;
 case 'tipok':var tp=tipOf();logBrew();applyTip(tp[2]);closeSh();closeBrew();toast(tp[0]+' · im Rezept übernommen');return;
 case 'ratesave':logBrew();closeSh();closeBrew();toast('Im Tagebuch');render();return;
 case 'obl':OB.lv=d.v;drawOb();return;
 case 'obd':var i2=OB.dev.indexOf(d.v);if(i2>=0)OB.dev.splice(i2,1);else OB.dev.push(d.v);drawOb();return;
 case 'obg':var i3=OB.gr.indexOf(d.v);if(i3>=0)OB.gr.splice(i3,1);else OB.gr.push(d.v);if(!OB.gr.length)OB.gr=['pre'];drawOb();return;
 case 'obs':OB.sc=+d.v;drawOb();return;case 'obk':OB.ke=+d.v;drawOb();return;
 case 'obnext':if(OB.step<2){OB.step++;drawOb()}else obDone();return;
 case 'obback':OB.step--;drawOb();return;
 case 'obskip':obDone(true);return;
 }});
document.addEventListener('input',function(ev){var x=ev.target;if(x.id=='eqName'){var e=byId(U.sh.id);if(e){e.name=x.value;save()}}if(x.id=='rzName'){var r=rzById(U.sh.id);if(r){r.name=x.value||r.name;if(W&&W.id==r.id)W.name=r.name;save()}}if(x.id=='meName'){PR.name=x.value;save()}});
document.addEventListener('change',function(ev){var x=ev.target;if(x.id=='eqName'||x.id=='rzName'||x.id=='meName')render()});
$('sh').addEventListener('click',function(e){if(e.target===this)closeSh()});
document.addEventListener('keydown',function(e){if(e.key=='Escape'){if(U.sh)closeSh();else if(!$('bw').hidden)closeBrew()}});
// −/+ für Feinschritte, gedrückt halten = schnell
var hold=null,hn=0;
function bump(k,i,dir){var c=getV(k,i),st=fine(k)*(hn>10&&k!='d'&&k!='grind'?5:1),nv;
 if(lvl()=='a'&&(k=='g'||k=='t'||k=='e')){var V=vals(k,i);nv=dir>0?(V.filter(function(v){return v[0]>c})[0]||[c])[0]:((V.filter(function(v){return v[0]<c}).pop())||[c])[0]}
 else if(k=='d'){var L=[3,5,6,8,10,12,15,18,20,25,30,35,40,50,60];nv=dir>0?(L.filter(function(v){return v>c})[0]||c+5):(L.filter(function(v){return v<c}).pop()||3)}
 else nv=Math.round((c+dir*st)*100)/100;setV(k,i,nv);touch();drawBr(1);center()}
document.addEventListener('pointerdown',function(e){var b=e.target.closest('.pm');if(!b||b.disabled)return;e.preventDefault();var r=b.closest('.ru'),k=r.dataset.rk,i=+r.dataset.ri,dr=+b.dataset.d;hn=0;bump(k,i,dr);
 (function rep(delay){hold=setTimeout(function(){hn++;var nb=document.querySelector('.ru[data-rk="'+k+'"] .pm[data-d="'+dr+'"]');if(!nb||nb.disabled)return;bump(k,i,dr);rep(hn>10?45:75)},delay)})(280)});
['pointerup','pointercancel'].forEach(function(t){document.addEventListener(t,function(){clearTimeout(hold);hn=0})});
$('bwGo').addEventListener('click',function(){if(B.done){newRating();openSh({k:'rate'});return}if(B.run){B.run=false;bbtn();relLock()}else bplay()});
$('bwAgain').addEventListener('click',function(){openBrew()});
$('bwX').addEventListener('click',closeBrew);

function boot(){theme();if(!DB.setup&&!qs){OB={step:0,dev:['v60'],gr:['comandante'],sc:1,ke:1,lv:PR.stufe||'m'};drawOb()}else{if(!DB.setup)seedDefaults();$('ob').hidden=true}render()}
window.BB={DB:function(){return DB},W:function(){return W},U:U,B:B,setV:setV,getV:getV,tipOf:tipOf,fromAtlas:fromAtlas,collect:collect};
boot();
if('serviceWorker' in navigator&&location.protocol=='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
})();

</script>
