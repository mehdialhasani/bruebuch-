/* Startseite: Bildkacheln Brühbuch, Tagesabschluss, Röstplan, Abpackhilfe, Verkauf im Farbschema Crema, ganz in Helvetica Neue */
:root{

  --f:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17120F; --paper:#211A16; --ink:#EFE7DF; --muted:#AD9E91; --line:#3A2F28;
  --accent:#D3A27C; --shadow:rgba(0,0,0,.5);
  --c1a:#5A412E; --c1b:#3B2A1E; --c2a:#3E2A1D; --c2b:#1B120D; --c3a:#39402F; --c3b:#1F241A; --c4a:#5B3A2A; --c4b:#2A1A12; --c5a:#4C4030; --c5b:#251D15;
  color-scheme:dark}
  .sheen{opacity:.35}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:16px/1.45 var(--f);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.date{margin:0;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
h1{margin:4px 0 22px;font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.025em}
.tiles{display:grid;gap:16px}
@media (min-width:900px){.wrap{max-width:1040px}.tiles{grid-template-columns:repeat(5,1fr)}.tile.soon{grid-column:1/-1}}
.tile{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:26px;overflow:hidden;

  transition:transform .18s cubic-bezier(.3,.7,.4,1),box-shadow .18s}
.tile:active{transform:scale(.975);box-shadow:0 1px 1px rgba(0,0,0,.03),0 6px 16px var(--shadow)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.art{display:block;width:100%;height:auto;aspect-ratio:340/170}
.meta{display:flex;align-items:center;gap:12px;padding:15px 16px 17px 20px}
.meta div{flex:1;min-width:0}
.meta h2{margin:0;font-size:22px;line-height:1.15;font-weight:700;letter-spacing:-.015em}
.meta p{margin:3px 0 0;color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p b{color:var(--accent);font-weight:600}
.go{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--accent)}
.go svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.foot{margin:22px 4px 0;color:var(--muted);font-size:13px;text-align:center}
@media (prefers-reduced-motion:no-preference){

  .pour{animation:pour 1.1s linear infinite}@keyframes pour{to{stroke-dashoffset:-28}}

/* Handy: alle drei Kacheln ohne Scrollen sichtbar, Bilder füllen den freien Platz (Ausschnitt mittig) */
@media (max-width:899px){

  .tile{flex:1 1 0;display:flex;flex-direction:column;border-radius:20px}

  .meta h2{font-size:19px}

  .go{width:30px;height:30px}

  .foot{margin-top:12px}
}
/* Kachel 4 Verkauf: Balken wachsen, Trend zeichnet sich, Prognose-Punkt pulsiert. Platzhalter Abpackhilfe: flach, gestrichelt */
.tile.mini .ico{color:var(--accent)}
@media (min-width:900px){.tile.mini{grid-column:1/-1}}
@media (max-width:899px){.tile.mini{flex:none;min-height:0}.tile.mini .meta{padding:9px 14px 9px 12px}}
.tile.soon{border-style:dashed;box-shadow:none;background:transparent;cursor:default}
.tile.soon:active{transform:none}
.ico{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.soonb{flex:none;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.tile.soon h2{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .tile:nth-child(4){animation-delay:.27s}.tile:nth-child(5){animation-delay:.36s}
  .bars .b{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.9,.3,1.15) both}
  .bars .b:nth-child(2){animation-delay:.08s}.bars .b:nth-child(3){animation-delay:.16s}.bars .b:nth-child(4){animation-delay:.24s}.bars .b:nth-child(5){animation-delay:.32s}.bars .b:nth-child(6){animation-delay:.4s}
  @keyframes grow{from{transform:scaleY(0)}to{transform:none}}
  .trend{animation:draw 7s ease-in-out .5s infinite both}
  @keyframes draw{0%{stroke-dashoffset:100}22%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
  .fline{animation:march 1.2s linear infinite}@keyframes march{to{stroke-dashoffset:-20}}
  .fb{animation:blink 2.4s ease-in-out infinite}.fb+.fb{animation-delay:.4s}@keyframes blink{50%{opacity:.35}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}
}
/* Datensicherung für alle Apps */
.bk{display:inline-flex;gap:2px;align-items:center}
.bk button,.bk label{font:600 13px var(--f);color:var(--accent);background:none;border:0;padding:0 6px;min-height:36px;display:inline-flex;align-items:center;cursor:pointer}
.foot .bk{vertical-align:middle;margin:-12px 0}
.bkask>.bk{display:flex;justify-content:center;gap:8px}
.bkask .bk button{border:1px solid var(--line);border-radius:999px;padding:0 16px;background:var(--bg);font-size:14px}
.bk input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.bk label:focus-within,.bk button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bkask{margin:10px auto 0;max-width:420px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:15px;text-align:center}
.bkask p{margin:0 0 10px}.bkask .bk{margin:0}
.bkask .bk button.main{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.bkmsg{margin:6px 0 0;text-align:center;color:var(--accent);font-size:14px;min-height:1.2em}
/* laden-v22: Titel liegt als durchscheinender Verlauf auf dem Bild, das Bild füllt die ganze Kachel */
.tile{position:relative;isolation:isolate}
.tile .meta{position:absolute;left:0;right:0;bottom:0;z-index:1;padding-top:26px;
  background:linear-gradient(to bottom,color-mix(in srgb,var(--paper) 0%,transparent),color-mix(in srgb,var(--paper) 62%,transparent) 42%,color-mix(in srgb,var(--paper) 80%,transparent))}
.tile .meta h2{text-shadow:0 1px 10px var(--paper),0 0 2px var(--paper)}
.tile .meta p{color:var(--ink);opacity:.78;text-shadow:0 1px 8px var(--paper)}
.tile .go{background:color-mix(in srgb,var(--bg) 75%,transparent)}
@media (max-width:899px){
  h1{margin-bottom:14px}
  .tiles{gap:10px}
  .art{min-height:96px}
  .tile .meta{padding-top:22px}
  .foot{margin-top:10px}
  .bkmsg{margin-top:2px;min-height:0}
}

<script>
(function(){
  const now = new Date(), h = now.getHours();
  document.getElementById("date").textContent = now.toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long"});
  document.getElementById("hello").textContent = h < 11 ? "Guten Morgen" : h < 17 ? "Guten Tag" : "Guten Abend";
  const get = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

  // Tagesabschluss: letzter gespeicherter Abschluss
  const hist = get("kasse.history");
  if (Array.isArray(hist) && hist.length) {
    const last = hist.map(x => String(x.date || "")).filter(Boolean).sort().pop();
    if (last) {
      const y = new Date(now); y.setDate(y.getDate() - 1);
      const d = new Date(last + "T12:00:00");
      const txt = last === iso(now) ? "<b>Heute abgeschlossen</b>"
        : last === iso(y) ? "Letzter Abschluss: gestern"
        : isNaN(d) ? "" : "Letzter Abschluss: " + esc(d.toLocaleDateString("de-DE", {weekday:"short", day:"numeric", month:"short"}));
      if (txt) document.getElementById("s1").innerHTML = txt;
    }
  }

  // Röstplan: Woche, Sorten, Menge
  const rp = get("roestplan.v4");
  if (rp && Array.isArray(rp.sorts) && rp.sorts.length && rp.source !== "preset") {
    const kg = rp.sorts.reduce((a, s) => a + (s.totalG | 0), 0) / 1000;
    document.getElementById("s2").innerHTML = (rp.week ? "<b>" + esc(rp.week) + "</b> · " : "") + rp.sorts.length + " Sorten · " + kg.toLocaleString("de-DE", {maximumFractionDigits: 0}) + " kg";
  }
  // Brühbuch: letzter Brühvorgang oder Anzahl Rezepte
  const bb = get("bruehbuch-v1");
  if (bb && bb.setup) {
    // frühere Beispiel-Tassen nicht als „zuletzt“ zeigen
    const l = Array.isArray(bb.log) && bb.log.filter(x => !(x.tip === "Beispiel" && x.grind == null && x.tds == null && x.taste === "ok"))[0], rz = Array.isArray(bb.rz) ? bb.rz.length : 0;
    let t = "";
    if (l && l.at) {
      const d = new Date(l.at), days = Math.round((new Date(iso(now) + "T12:00:00") - new Date(iso(d) + "T12:00:00")) / 864e5);
      const when = days === 0 ? "heute" : days === 1 ? "gestern" : d.toLocaleDateString("de-DE", {day:"numeric", month:"short"});
      t = "Zuletzt <b>" + esc(l.name || "gebrüht") + "</b> · " + when;
    } else if (rz) t = rz + (rz === 1 ? " Rezept" : " Rezepte");
    if (t) document.getElementById("s3").innerHTML = t;
  }

  // Verkauf: letzte KW und Schnitt der letzten 4 Wochen
  const vk = get("verkauf.kurz");
  if (vk && vk.kw) document.getElementById("s4").innerHTML = "<b>KW " + (vk.kw | 0) + "</b> · Ø " + Number(vk.avg).toLocaleString("de-DE", {maximumFractionDigits: 1}) + " kg/Woche" + (vk.d == null ? "" : " · " + (vk.d >= 0 ? "▲ +" : "▼ −") + Math.abs(vk.d) + " %");
  if (vk && vk.d != null) document.getElementById("vkp").textContent = (vk.d >= 0 ? "+" : "−") + Math.abs(vk.d) + " %";
  // Abpackhilfe: was aufs Abpacken wartet, Stand im Lager (Eigenbedarf)
  const ap = get("abpack.kurz"), fk = v => Number(v).toLocaleString("de-DE", {maximumFractionDigits: 1});
  if (ap && (ap.n || ap.wk > 0)) document.getElementById("s5").innerHTML = (ap.wk > 0 ? "<b>" + fk(ap.wk) + " kg</b> zum Abpacken · " : "") + "Lager <b>" + fk(ap.st) + " kg</b>" + (ap.pw == null || ap.wk > 0 ? "" : " · Ø " + fk(ap.pw) + " kg/Woche");
  // Datensicherung: alle Daten der drei Apps in einer Datei (Schlüssel bleiben unverändert)
  const KEYS = k => /^(kasse\.|roestplan|bruehbuch|verkauf\.|gehirn\.|abpack\.)/.test(k);
  const $ = id => document.getElementById(id), say = t => { $("bkMsg").textContent = t; };
  $("bkSave").onclick = async () => {
    const data = {}; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (KEYS(k)) data[k] = localStorage.getItem(k); }
    const name = "laden-sicherung-" + iso(new Date()) + ".json";
    const blob = new Blob([JSON.stringify({ app: "laden", v: 1, at: new Date().toISOString(), data })], { type: "application/json" });
    try { const file = new File([blob], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Laden-Sicherung" }); say("Gesichert."); return; } }
    catch (e) { if (e && e.name === "AbortError") { say("Abgebrochen."); return; } }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); say("Sicherung erstellt: " + name);
  };
  let pending = null;
  $("bkIn").onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    let d; try { d = JSON.parse(await f.text()); } catch (_) { d = null; }
    if (!d || d.app !== "laden" || !d.data || typeof d.data !== "object") { say("Das ist keine Laden-Sicherung."); return; }
    pending = Object.fromEntries(Object.entries(d.data).filter(([k, v]) => KEYS(k) && typeof v === "string"));
    const when = new Date(d.at); $("bkQ").textContent = "Sicherung vom " + (isNaN(when) ? "?" : when.toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" })) + " laden? Die Daten auf diesem Handy werden dadurch ersetzt.";
    $("bkAsk").hidden = false; say(""); $("bkYes").focus();
  };
  $("bkNo").onclick = () => { pending = null; $("bkAsk").hidden = true; };
  $("bkYes").onclick = () => {
    if (!pending) return;
    try { Object.entries(pending).forEach(([k, v]) => localStorage.setItem(k, v)); } catch (_) { say("Laden hat nicht geklappt, der Speicher ist voll."); return; }
    pending = null; $("bkAsk").hidden = true; say("Sicherung geladen."); setTimeout(() => location.reload(), 900);
  };
})();
</script>
