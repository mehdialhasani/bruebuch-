<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brühbuch</title>
<meta name="description" content="Rezepte, Gießplan und Ausrüstung für Filterkaffee, AeroPress und French Press">
<meta name="theme-color" content="#f2ede6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brühbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:light;
 --bg:#f2ede6;--card:#fffdfa;--ink:#1d1d1f;--ink2:#5d544c;--mut:#968b80;--hair:rgba(90,60,30,.13);
 --acc:#8a5a3b;--acc2:#c99a6b;--fill:rgba(138,90,59,.09);--fill2:rgba(120,90,60,.15);--warn:#c0503a;--ok:#2f8a55;--bar:#f7f3ee;
 --f:"Helvetica Neue",Helvetica,Arial,sans-serif;
 --num:"Helvetica Neue",Helvetica,Arial,sans-serif;
 /* Aufguss-Farben (Okabe-Ito-nah) + Form je Aufguss */
 --c0:#3f6fa8;--c1:#d9822b;--c2:#7d5fae;--c3:#2f9773;--c4:#c4533a;--c5:#3e9fc8;
 --pp-bg1:#fffdf9;--pp-bg2:#ecdfcf;--pp-halo:#ffffff;--pp-ink:#1d1d1f;--pp-ink2:#7a6b5e;--pp-acc:#9a6236;--pp-acc2:#e0aa6c;
 --pp-track:rgba(120,90,60,.13);--pp-seg:rgba(154,98,54,.30);--pp-glass:rgba(255,255,255,.42);--pp-glass-edge:rgba(105,80,58,.42);
 --pp-paper:#fbf6ee;--pp-steam:rgba(130,110,90,.45);--pp-scale:#ddd3c7;--pp-chip:rgba(255,255,255,.72);--pp-rim:rgba(255,255,255,.0)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
 --bg:#151210;--card:#211c18;--ink:#f4efe9;--ink2:#c9bdb1;--mut:#8f8378;--hair:rgba(255,235,210,.12);
 --acc:#d69c66;--acc2:#8a6040;--fill:rgba(214,156,102,.12);--fill2:rgba(214,156,102,.2);--warn:#e8775f;--ok:#5cc487;--bar:#1b1714;
 --c0:#6f9be0;--c1:#f0a04a;--c2:#a88ad8;--c3:#4fc095;--c4:#e8775f;--c5:#6cc3e6;
 --pp-bg1:#33291f;--pp-bg2:#0d0b09;--pp-halo:#5a4330;--pp-ink:#f5f2ee;--pp-ink2:#b9ab9d;--pp-acc:#d39a5e;--pp-acc2:#f3c993;
 --pp-track:rgba(255,255,255,.09);--pp-seg:rgba(211,154,94,.36);--pp-glass:rgba(255,255,255,.06);--pp-glass-edge:rgba(255,255,255,.34);
 --pp-paper:#3b3129;--pp-steam:rgba(255,255,255,.32);--pp-scale:#2d2622;--pp-chip:rgba(30,25,22,.78);--pp-rim:rgba(255,255,255,.22)}}
:root[data-theme=dark]{color-scheme:dark;
 --bg:#151210;--card:#211c18;--ink:#f4efe9;--ink2:#c9bdb1;--mut:#8f8378;--hair:rgba(255,235,210,.12);
 --acc:#d69c66;--acc2:#8a6040;--fill:rgba(214,156,102,.12);--fill2:rgba(214,156,102,.2);--warn:#e8775f;--ok:#5cc487;--bar:#1b1714;
 --c0:#6f9be0;--c1:#f0a04a;--c2:#a88ad8;--c3:#4fc095;--c4:#e8775f;--c5:#6cc3e6;
 --pp-bg1:#33291f;--pp-bg2:#0d0b09;--pp-halo:#5a4330;--pp-ink:#f5f2ee;--pp-ink2:#b9ab9d;--pp-acc:#d39a5e;--pp-acc2:#f3c993;
 --pp-track:rgba(255,255,255,.09);--pp-seg:rgba(211,154,94,.36);--pp-glass:rgba(255,255,255,.06);--pp-glass-edge:rgba(255,255,255,.34);
 --pp-paper:#3b3129;--pp-steam:rgba(255,255,255,.32);--pp-scale:#2d2622;--pp-chip:rgba(30,25,22,.78);--pp-rim:rgba(255,255,255,.22)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
.pg{max-width:460px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(86px + env(safe-area-inset-bottom))}
h1{font-size:28px;letter-spacing:-.03em;margin:6px 2px 12px}
h2.sh{font-size:13px;font-weight:600;color:var(--mut);text-transform:none;margin:18px 4px 6px}
.mut{color:var(--mut)}
.pk{width:100%;height:100%;display:block}
/* Tab-Leiste: fester Hintergrund, kein Filter */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--bar);border-top:1px solid var(--hair);padding:6px 8px max(8px,env(safe-area-inset-bottom))}
.tabs button{flex:1;max-width:150px;border:0;background:none;display:grid;justify-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:600;color:var(--mut)}
.tabs svg{width:26px;height:26px}
.tabs button.on{color:var(--acc)}
/* Heute-Leiste (womit brühe ich) */
.today{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:2px 16px}
.today::-webkit-scrollbar{display:none}
.tdy{flex:none;display:flex;align-items:center;gap:7px;height:44px;padding:0 12px 0 5px;border:1px solid var(--hair);border-radius:14px;background:var(--card);font-size:13px;font-weight:650;max-width:200px}
.tdy .ic{width:34px;height:34px;flex:none}
.tdy span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdy small{display:block;font-size:10.5px;font-weight:500;color:var(--mut);line-height:1}
/* Rezept-Kopf */
.rh{display:flex;align-items:center;gap:10px;margin:2px 2px 10px}
.rh .t{flex:1;min-width:0}
.rh .t b{display:block;font-size:20px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh .t span{font-size:12.5px;color:var(--mut)}
.pill{height:34px;padding:0 13px;border:0;border-radius:99px;background:var(--fill2);font-size:13px;font-weight:650;color:var(--ink);white-space:nowrap}
.pill.acc{background:var(--acc);color:#fff}
/* Kennzahlen */
.kz{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.kz div{background:var(--card);border-radius:14px;padding:8px 8px 7px;min-width:0}
.kz b{display:block;font:400 17px var(--num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kz span{font-size:11px;color:var(--mut)}
/* Diagramm */
.chart{background:var(--card);border-radius:18px;margin-bottom:10px;position:relative}
.chart svg{display:block;width:100%;height:auto}
.t{fill:var(--mut);font:10px var(--f)}
.tb{fill:var(--ink);font:500 11px var(--num)}
.gr{stroke:var(--hair);stroke-width:1}
.lay{opacity:.12;cursor:pointer}.lay.on{opacity:.26}
.hit{fill:transparent;touch-action:none;cursor:grab}
.bub rect{fill:var(--pc)}.bub text{fill:#fff;font:500 13px var(--num)}
.gh{fill:none;stroke:var(--mut);stroke-width:1.4;stroke-dasharray:4 4;opacity:.7}
.ln{fill:none;stroke:var(--acc);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chint{position:absolute;left:44px;top:4px;font-size:11px;color:var(--mut)}
/* Marke: Form + Nummer */
.mk{display:inline-grid;place-items:center;width:26px;height:26px;flex:none;position:relative}
.mk svg{position:absolute;inset:0;width:100%;height:100%}
.mk i{position:relative;font:700 12px var(--num);font-style:normal;color:#fff}
.mk.ic0{color:var(--mut);font-weight:700}
/* Lineal */
.ru{display:flex;gap:6px;align-items:center;min-width:0}
.pm{flex:none;width:42px;height:42px;border:0;border-radius:12px;background:var(--fill2);font:600 22px var(--num);user-select:none;-webkit-user-select:none}
.pm:active{background:var(--pc,var(--acc));color:#fff}.pm:disabled{opacity:.3}
.rl{flex:1;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.rl::-webkit-scrollbar{display:none}
.rv{flex:none;min-width:48px;height:42px;padding:0 10px;border:1px solid var(--hair);border-radius:11px;background:var(--card);font:400 15px var(--num);white-space:nowrap}
.rv.on{background:var(--pc,var(--acc));border-color:var(--pc,var(--acc));color:#fff}
.seg{display:flex;padding:3px;border-radius:11px;background:var(--fill)}
.seg button{flex:1;min-width:0;height:34px;border:0;border-radius:9px;background:none;font-size:13px;font-weight:650;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg button b{font-family:var(--num)}
.tch{display:flex;gap:5px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border:1px solid var(--hair);border-radius:99px;background:var(--card);font-size:12.5px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--pc,var(--acc));border-color:var(--pc,var(--acc));color:#fff}
.acts{display:flex;gap:4px;justify-content:flex-end}
.lnk{height:32px;padding:0 8px;border:0;background:none;font-size:13.5px;font-weight:650;color:var(--acc)}
.lnk.del{color:var(--warn)}
.note{font-size:12.5px;color:var(--mut);line-height:1.35}
/* A Ausklappen */
.ac{background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:10px}
.ar{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border:0;background:none;text-align:left;border-bottom:1px solid var(--hair)}
.ac>div:last-child>.ar,.ac>div:last-child>.ab{border-bottom:0}
.ar .nm{flex:1;min-width:0}.ar .nm b{display:block;font-size:15px}.ar .nm span{display:block;font-size:12.5px;color:var(--mut);margin-top:1px}
.ar .big{font:400 19px var(--num);white-space:nowrap}
.ar .chev{width:18px;height:18px;color:var(--mut);transition:transform .2s;flex:none}
.ao .ar{background:color-mix(in srgb,var(--pc) 9%,var(--card))}
.ao .ar .chev{transform:rotate(180deg)}
.ab{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:8px 14px 12px;background:color-mix(in srgb,var(--pc) 9%,var(--card));border-bottom:1px solid var(--hair)}
.ar .ic{width:30px;height:30px;flex:none}
/* Fuß */
.foot{display:flex;align-items:center;gap:8px;margin:2px 2px 12px;flex-wrap:wrap}
.foot .sp{flex:1}
.go{display:block;width:100%;height:54px;border:0;border-radius:16px;background:var(--acc);color:#fff;font-size:17px;font-weight:700;margin:6px 0 8px}
.go:active{transform:scale(.99)}
.sec{display:flex;gap:8px}
.sec button{flex:1}
/* Anfänger:in */
.cups{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.cupb{border:1px solid var(--hair);border-radius:16px;background:var(--card);padding:10px 0 8px;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--ink2)}
.cupb svg{width:34px;height:34px}
.cupb b{font:400 17px var(--num);color:var(--ink)}
.cupb.on{border-color:var(--acc);box-shadow:0 0 0 1.5px var(--acc)}
.easy{background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:10px;display:grid;gap:4px}
.easy .r{display:flex;gap:10px;align-items:baseline}
.easy .r span{color:var(--mut);min-width:64px;flex:none;font-size:13px}
.easy .r b{font-size:15px;font-weight:500}
/* Listen (Profil, Rezepte) */
.ls{background:var(--card);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 14px;border:0;border-bottom:1px solid var(--hair);background:none;text-align:left}
.ls>.li:last-child,.ls>:last-child .li{border-bottom:0}
.li .ic{width:36px;height:36px;flex:none}
.li .nm{flex:1;min-width:0}
.li .nm b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .nm span{display:block;font-size:12.5px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .val{font-size:14px;color:var(--mut);white-space:nowrap}
.li .star{width:22px;height:22px;flex:none;color:var(--acc)}
.li.add{color:var(--acc);font-weight:650;justify-content:flex-start;min-height:46px}
.li.add .ic{display:grid;place-items:center;font-size:22px;width:36px}
.li .go2{width:16px;height:16px;color:var(--mut);flex:none}
/* Profil-Kopf */
.me{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.av{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 24px var(--num);color:#fff;background:linear-gradient(140deg,#c98b57,#7a4a2c)}
.me input{border:0;background:none;font-size:20px;font-weight:700;width:100%;padding:2px 0;border-bottom:1px solid transparent}
.me input:focus{outline:0;border-bottom-color:var(--hair)}
.me .nm{flex:1;min-width:0}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.lvb{border:1px solid var(--hair);border-radius:16px;background:var(--card);padding:10px 6px 9px;display:grid;justify-items:center;gap:4px;font-size:12.5px;font-weight:650}
.lvb svg{width:40px;height:40px}
.lvb.on{border-color:var(--acc);box-shadow:0 0 0 1.5px var(--acc)}
/* Blatt (Sheet) */
.shw{position:fixed;inset:0;z-index:55;background:rgba(20,14,10,.38);display:flex;align-items:flex-end;justify-content:center}
.sht{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px max(18px,env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sht{animation:none}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--hair);margin:2px auto 8px}
.shh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.shh b{flex:1;font-size:18px}
.x{width:34px;height:34px;border:0;border-radius:50%;background:var(--fill2);font-size:18px;line-height:1}
.fl{display:grid;gap:6px;margin-bottom:12px}
.fl>label,.fl>.lab{font-size:12.5px;color:var(--mut);margin-left:2px}
.tx{width:100%;height:44px;border:1px solid var(--hair);border-radius:12px;background:var(--card);padding:0 12px;font-size:15px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--hair);border-radius:16px;background:var(--card);padding:8px 4px 8px;display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:600;text-align:center;line-height:1.15;min-height:92px}
.tile .ic{width:44px;height:44px}
.tile.on{border-color:var(--acc);box-shadow:0 0 0 1.5px var(--acc)}
.tile small{font-weight:500;color:var(--mut);font-size:10.5px}
/* Einrichtung */
.ob{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto}
.ob .pg{padding-bottom:max(24px,env(safe-area-inset-bottom))}
.obs{display:flex;gap:5px;justify-content:center;margin:8px 0 14px}
.obs i{width:26px;height:5px;border-radius:3px;background:var(--hair)}.obs i.on{background:var(--acc)}
.ob h1{text-align:center;margin-bottom:4px}
.ob p.lead{text-align:center;color:var(--mut);margin:0 0 16px}
.ob .pg{min-height:100%;display:flex;flex-direction:column}
.ob-hi{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:60vh}
.ob-hallo{font:200 clamp(38px,12vw,64px)/1.05 var(--f);text-align:center;letter-spacing:-.04em;margin-bottom:12px;animation:obHi 1.1s cubic-bezier(.2,.7,.2,1) both}
.ob-hi .lead{max-width:300px;animation:obHi 1.1s .25s cubic-bezier(.2,.7,.2,1) both}
@keyframes obHi{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ob-f{animation:obF .35s cubic-bezier(.2,.7,.2,1)}.ob-b{animation:obB .35s cubic-bezier(.2,.7,.2,1)}
@keyframes obF{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}@keyframes obB{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.ob-name{margin-top:22px;width:min(280px,100%);height:50px;border:0;border-radius:14px;background:var(--card);color:var(--ink);font:300 20px var(--f);text-align:center;animation:obHi 1.1s .45s cubic-bezier(.2,.7,.2,1) both}
.ob-name::placeholder{color:var(--mut)}
.ob-demo{margin-bottom:4px}.ob-demo .bub rect{fill:var(--pc)}.ob-demo .bub text{fill:#fff;font:400 12px var(--num)}
.ob-fg{fill:rgba(255,255,255,.35);stroke:var(--ink);stroke-width:1.4;opacity:.85}
.ob-cap{text-align:center;font-size:15px;color:var(--ink);margin:2px 0 12px;min-height:20px}
.tr-x{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.7,.2,1)}.tr-x.on{grid-template-rows:1fr}.tr-x>div{overflow:hidden;min-height:0}
.tr-ru{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:8px 2px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent)}.tr-ru::-webkit-scrollbar{display:none}
.tr-v{flex:none;width:48px;height:48px;border:0;border-radius:12px;background:var(--fill2);font:400 17px var(--num);scroll-snap-align:center;transition:background .15s,color .15s}.tr-v.on{background:var(--acc);color:#fff}
.tr-n{transition:opacity .15s}.ob-demo svg{touch-action:none}.ob-demo{position:relative}
.ob-wo{font-size:15px;color:var(--ink);background:var(--card);border-radius:12px;padding:8px 14px;margin:0;animation:obHi 1.1s .45s cubic-bezier(.2,.7,.2,1) both}
.ob-r{background:var(--card);border-radius:18px;padding:4px 12px}
.ob-r .ic.gi{display:flex;align-items:center;justify-content:center;width:44px;height:44px}.ob-r .ic.gi svg{width:36px;height:36px}
.ob-ctl{display:flex;gap:8px;margin-top:auto;padding-top:18px}.ob-ctl .pill{flex:1;height:50px}
@media (prefers-reduced-motion:reduce){.ob-hallo,.ob-hi .lead,.ob-f,.ob-b{animation:none}}
/* Brühen-Vollbild */
.bw{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto}
.bw .pg{display:flex;flex-direction:column;align-items:center;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.bwh{display:flex;width:100%;align-items:center;gap:8px}
.bwh b{flex:1;font-size:15px;text-align:center}
#stage{width:min(100%,320px);aspect-ratio:1}
.pp{width:100%;height:100%;display:block;overflow:visible}
.pp-g{font-family:var(--num);font-size:17px;font-weight:500;fill:var(--pp-ink);font-variant-numeric:tabular-nums}
.pp-gc{font-family:var(--f);font-size:10.5px;font-weight:600;fill:var(--pp-ink2)}
.time{font:200 50px/1 var(--num);letter-spacing:-.02em;margin-top:4px}
.btitle{margin-top:8px;font-size:23px;font-weight:700;letter-spacing:-.02em;text-align:center}
.bline{margin-top:4px;font-size:15px;color:var(--ink2);text-align:center;min-height:20px}
.bnext{margin-top:3px;font-size:13px;color:var(--mut);text-align:center;min-height:18px}
.bbig{display:flex;gap:8px;align-items:baseline;margin-top:8px}
.bbig b{font:300 28px var(--num)}.bbig span{color:var(--mut)}
.strip{width:100%;display:block;margin-top:10px}
.bctl{display:flex;gap:8px;width:100%;margin-top:12px}
.bctl .go{margin:0;flex:2}.bctl .pill{flex:1;height:54px;border-radius:16px}
.ring2{width:min(100%,300px);aspect-ratio:1}
/* Bewerten */
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.kp button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stars{display:flex;gap:4px;justify-content:center}
.stars button{width:46px;height:46px;border:0;background:none;font-size:30px;color:var(--hair);line-height:1}
.stars button.on{color:#e0a43a}
.tip{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;margin:10px 0}
.tip b{display:block}
.tip .nm{flex:1}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:600;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.empty{padding:18px;text-align:center;color:var(--mut);background:var(--card);border-radius:16px}
.hist .li .val{font-family:var(--num);font-weight:400;color:var(--ink)}
@media (min-width:700px){.pg{padding-top:24px}}

.hb{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 12px 6px 6px;border:1px solid var(--hair);border-radius:16px;background:var(--card);text-align:left;margin-bottom:10px}
.hb .ic{width:38px;height:38px;flex:none}
.hb .nm{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb small{display:block;font-size:11px;font-weight:500;color:var(--mut);line-height:1.2}
.hb .go2{width:16px;height:16px;color:var(--mut);flex:none}
.seg.dv{margin-bottom:10px}.seg.dv button{height:38px}
.fix{font-size:15px;font-weight:600;padding:2px 2px 0}
.rh .eh{width:44px;height:44px;flex:none}
/* Ansicht: Kennzahlen, Meta, ruhige Linie */
.kzb{width:100%;border:0;background:none;padding:0;text-align:left}
.meta{display:block;width:100%;border:0;background:none;text-align:left;font-size:13px;color:var(--ink2);margin:-2px 0 10px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line{display:block;width:100%;border:0;background:var(--card);border-radius:18px;padding:6px 8px;margin-bottom:10px;text-align:left}
.line svg{display:block;width:100%;height:auto}
.sht .line{margin-bottom:12px}
.lx{stroke:var(--ink2);stroke-opacity:.5;stroke-width:1.2}.lx.sm{stroke-opacity:.3}
.lf{stroke:var(--ink);stroke-width:1.3;stroke-linecap:round}
.l0{fill:var(--ink);font:500 11px var(--num)}.l1{fill:var(--ink);font:400 11px var(--f)}.l2{fill:var(--mut);font:400 11px var(--f)}
.bwc{width:100%;margin:10px 0 0}
/* Profil: Gruppen in einer Liste */
.gh2{font-size:12px;font-weight:600;color:var(--mut);padding:12px 14px 2px;border-bottom:1px solid var(--hair)}
.li.more{background:var(--card);border-radius:16px;margin-top:14px;border:0}
.li.more .chev{width:18px;height:18px;color:var(--mut);transition:transform .2s}
.li.more[aria-expanded=true] .chev{transform:rotate(180deg)}
/* Entwurf-Leiste */
.ewb{max-width:460px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 0;display:grid;gap:6px}
.ewb .seg button{height:32px;font-size:12.5px}
.ewb small{font-size:11px;color:var(--mut);margin-left:4px}
.ewb+section .pg{padding-top:10px}
.warnb{background:var(--warn)!important;color:#fff!important}
.line.bwc{padding:4px 6px}
/* Linie bearbeiten */
.led{touch-action:pan-y;position:relative}
.lzo{position:absolute;right:10px;bottom:6px;border:0;border-radius:999px;background:var(--fill2);color:var(--ink);font:400 13px var(--f);padding:7px 12px;min-height:32px}
.lhit{fill:transparent;touch-action:none;cursor:grab}
.seg.avw{margin-bottom:10px}
.ar.st{cursor:default}
/* Anfänger:in: nur Kaffee und Wasser */
.ez{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.ez>div{background:var(--card);border-radius:18px;padding:14px 14px 12px;min-width:0}
.ez small{display:block;font-size:13px;color:var(--mut)}
.ez b{display:block;font:300 34px/1.15 var(--num);letter-spacing:-.02em;margin:2px 0 4px;white-space:nowrap}
.ez span{display:block;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ezm{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:44px;border:0;background:none;color:var(--mut);font-size:15px;margin-bottom:4px}
.ezm .chev{width:16px;height:16px;transition:transform .2s}
.ezm[aria-expanded=true] .chev{transform:rotate(180deg)}

.hq{flex:none;width:34px;height:34px;border:1px solid var(--hair);border-radius:50%;background:var(--card);color:var(--ink2);font-size:15px;position:relative}
.hq::after{content:"";position:absolute;inset:-5px}
/* Hilfe im Prezi-Stil */
.hk-r{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--hair)}.hk-r:first-child{border-top:0}
.hk-r>span b{display:block;font-size:15px;font-weight:500}.hk-r>span span{display:block;font-size:13px;color:var(--ink2)}
.gi{flex:none;width:44px;height:44px}
.gi .ga{fill:none;stroke:var(--mut);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.gi .gd{fill:var(--acc)}.gi .gf{fill:rgba(255,255,255,.35);stroke:var(--ink);stroke-width:1.4;opacity:.8}
.gi-tap .gf{animation:giTap 1.8s ease-in-out infinite;transform-origin:24px 24px}
.gi-y .gf,.gi-y .gd{animation:giY 2.2s ease-in-out infinite}
.gi-x .gf,.gi-x .gd{animation:giX 2.2s ease-in-out infinite}
.gi-sw .gf{animation:giX 2.2s ease-in-out infinite}

@keyframes giX{0%,100%{transform:translateX(0)}35%{transform:translateX(12px)}70%{transform:translateX(-10px)}}
.line .l0.hi{font-weight:500}
@media (prefers-reduced-motion:reduce){.gi *{animation:none!important}}
